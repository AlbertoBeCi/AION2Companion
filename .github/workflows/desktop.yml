name: Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:test
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AION2Companion-Windows
          path: release/AION2-Companion-*-Windows.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-diagnostics
          path: test-results/
